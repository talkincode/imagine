name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: imagine-linux-x86_64
            zig_target: x86_64-linux-musl
          - asset: imagine-linux-aarch64
            zig_target: aarch64-linux-musl
          - asset: imagine-macos-x86_64
            zig_target: x86_64-macos
          - asset: imagine-macos-aarch64
            zig_target: aarch64-macos
          - asset: imagine-windows-x86_64.exe
            zig_target: x86_64-windows
          - asset: imagine-windows-aarch64.exe
            zig_target: aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify tag matches src/version.zig
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          ver="$(sed -n 's/.*string *= *"\([^"]*\)".*/\1/p' src/version.zig | head -n1)"
          echo "tag=$tag  version.zig=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ($tag) does not match src/version.zig ($ver). Bump src/version.zig before tagging."
            exit 1
          fi

      - name: Build
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast -Dstrip=true

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [ -f zig-out/bin/imagine.exe ]; then
            cp zig-out/bin/imagine.exe "dist/${{ matrix.asset }}"
          else
            cp zig-out/bin/imagine "dist/${{ matrix.asset }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package archives, skill + checksums
        shell: bash
        run: |
          tar -czf dist/imagine-skill.tar.gz -C skills imagine
          for target in imagine-linux-x86_64 imagine-linux-aarch64 imagine-macos-x86_64 imagine-macos-aarch64; do
            tar -czf "dist/${target}.tar.gz" -C dist "$target" -C "$GITHUB_WORKSPACE" skills
          done
          ( cd dist && sha256sum imagine-* > SHA256SUMS )
          echo "=== release assets ===" && ls -la dist

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: imagine ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            ### Homebrew (macOS / Linux)

            ```sh
            brew install talkincode/tap/imagine
            ```

            ### Linux / macOS — one-liner:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Windows — download `imagine-windows-x86_64.exe` (or `-aarch64`) below and put it on your `PATH`.

            ### Assets
            | Platform | File |
            |----------|------|
            | Linux x86_64 | `imagine-linux-x86_64`, `imagine-linux-x86_64.tar.gz` |
            | Linux arm64 | `imagine-linux-aarch64`, `imagine-linux-aarch64.tar.gz` |
            | macOS x86_64 | `imagine-macos-x86_64`, `imagine-macos-x86_64.tar.gz` |
            | macOS arm64 | `imagine-macos-aarch64`, `imagine-macos-aarch64.tar.gz` |
            | Windows x86_64 | `imagine-windows-x86_64.exe` |
            | Windows arm64 | `imagine-windows-aarch64.exe` |
            | Agent skill | `imagine-skill.tar.gz` |

            Verify downloads against `SHA256SUMS`.
          files: |
            dist/imagine-linux-x86_64
            dist/imagine-linux-aarch64
            dist/imagine-macos-x86_64
            dist/imagine-macos-aarch64
            dist/imagine-linux-x86_64.tar.gz
            dist/imagine-linux-aarch64.tar.gz
            dist/imagine-macos-x86_64.tar.gz
            dist/imagine-macos-aarch64.tar.gz
            dist/imagine-windows-x86_64.exe
            dist/imagine-windows-aarch64.exe
            dist/imagine-skill.tar.gz
            dist/SHA256SUMS

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: talkincode/homebrew-tap
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render and push formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${REF#refs/tags/}"
          TAG="${TAG#refs/heads/}"
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          for target in imagine-linux-x86_64 imagine-linux-aarch64 imagine-macos-x86_64 imagine-macos-aarch64; do
            tar -czf "dist/${target}.tar.gz" -C dist "$target" -C "$GITHUB_WORKSPACE" skills
          done
          ( cd dist && sha256sum imagine-* > SHA256SUMS )
          CHECKSUMS="dist/SHA256SUMS"

          sha() {
            local hash
            hash="$(awk -v f="$1" '$2 == f || $2 == "*"f { print $1; exit }' "$CHECKSUMS")"
            [ -n "$hash" ] || { echo "missing checksum for $1" >&2; exit 1; }
            echo "$hash"
          }

          MACOS_ARM64_SHA="$(sha imagine-macos-aarch64.tar.gz)"
          MACOS_AMD64_SHA="$(sha imagine-macos-x86_64.tar.gz)"
          LINUX_ARM64_SHA="$(sha imagine-linux-aarch64.tar.gz)"
          LINUX_AMD64_SHA="$(sha imagine-linux-x86_64.tar.gz)"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/imagine.rb <<EOF
class Imagine < Formula
  desc "Universal image-generation CLI for AI agents"
  homepage "https://github.com/${GITHUB_REPOSITORY}"
  version "${VERSION}"
  license "MIT"

  on_macos do
    if Hardware::CPU.arm?
      url "${BASE_URL}/imagine-macos-aarch64.tar.gz"
      sha256 "${MACOS_ARM64_SHA}"
    else
      url "${BASE_URL}/imagine-macos-x86_64.tar.gz"
      sha256 "${MACOS_AMD64_SHA}"
    end
  end

  on_linux do
    if Hardware::CPU.arm?
      url "${BASE_URL}/imagine-linux-aarch64.tar.gz"
      sha256 "${LINUX_ARM64_SHA}"
    else
      url "${BASE_URL}/imagine-linux-x86_64.tar.gz"
      sha256 "${LINUX_AMD64_SHA}"
    end
  end

  def install
    bin.install Dir["imagine-*"].find { |f| File.file?(f) && File.executable?(f) } => "imagine"
    pkgshare.install "skills" if File.directory?("skills")
  end

  def caveats
    <<~EOS
      The agent skill has been installed to:
        #{opt_pkgshare}/skills/imagine

      To use it with your AI agent, link or copy it to your skills folder:
        mkdir -p ~/.agents/skills
        cp -R #{opt_pkgshare}/skills/imagine ~/.agents/skills/
    EOS
  end

  test do
    assert_match version.to_s, shell_output("#{bin}/imagine version")
  end
end
EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/imagine.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}"
          else
            git commit -m "imagine ${VERSION}"
            git push
          fi

      - name: Skip notice
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: echo "HOMEBREW_TAP_TOKEN secret is not configured; skipping Homebrew tap update."
